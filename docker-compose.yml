services:
  db:
    image: postgres:16-alpine
    container_name: avito_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-avito_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-avito_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: avito_db
    profiles: ["pipeline"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-avito_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      AVITO_SEARCH_URL: ${AVITO_SEARCH_URL:-https://www.avito.ma/fr/maroc/immobilier}
      SCRAPER_MAX_PAGES: ${SCRAPER_MAX_PAGES:-80}
      SCRAPER_DELAY_SECONDS: ${SCRAPER_DELAY_SECONDS:-3}
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-30}
      SCRAPER_MAX_RETRIES: ${SCRAPER_MAX_RETRIES:-3}
      SCRAPER_MAX_BLOCKED_RESPONSES: ${SCRAPER_MAX_BLOCKED_RESPONSES:-1}
      SCRAPER_MAX_EMPTY_PAGES: ${SCRAPER_MAX_EMPTY_PAGES:-3}
      SCRAPER_STRICT_ROBOTS: ${SCRAPER_STRICT_ROBOTS:-false}
      FETCH_DETAIL_PAGES: ${FETCH_DETAIL_PAGES:-false}
      CLEAN_STAGING_AFTER_SUCCESS: ${CLEAN_STAGING_AFTER_SUCCESS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - .:/app
      - ./data:/app/data
    command: ["python", "-m", "src.orchestration.run_pipeline"]

volumes:
  postgres_data:
